apiVersion: v1
kind: Namespace
metadata:
  name: payment-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-gateway-config
  namespace: payment-gateway
data:
  APP_ENV: production
  PORT: "8080"
  LOG_FORMAT: json
  LOG_LEVEL: info
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  RATE_LIMIT_RPS: "100"
  RATE_LIMIT_BURST: "200"
  CORS_ORIGINS: "https://merchant.example.com"
  EXCHANGE_PROVIDER: binance
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-gateway-secrets
  namespace: payment-gateway
type: Opaque
stringData:
  # Replace every value below before applying. Never commit real secrets.
  JWT_SECRET: "replace-with-at-least-32-random-characters"
  ADMIN_API_KEY: "replace-with-a-random-admin-key"
  INBOUND_WEBHOOK_SECRET: "replace-with-a-random-webhook-secret"
  DATABASE_URL: "postgres://gateway:gateway@postgres.example.com:5432/gateway?sslmode=require"
  REDIS_PASSWORD: "replace-with-redis-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payment-gateway
  labels:
    app.kubernetes.io/name: payment-gateway
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: ghcr.io/example/blockchain-payment-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-gateway-config
            - secretRef:
                name: payment-gateway-secrets
          env:
            - name: DATABASE_DRIVER
              value: postgres
            - name: CACHE_DRIVER
              value: redis
            - name: REDIS_ADDR
              value: redis.example.com:6379
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: payment-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-gateway
  namespace: payment-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-gateway
  namespace: payment-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.merchant.example.com
      secretName: payment-gateway-tls
  rules:
    - host: api.merchant.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-gateway
                port:
                  name: http
