services:
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: blockchain-payment-gateway:local
    environment:
      APP_ENV: development
      PORT: "8080"
      LOG_FORMAT: json
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      CACHE_DRIVER: redis
      REDIS_ADDR: redis:6379
      JWT_SECRET: local-development-secret-change-before-production
      ADMIN_API_KEY: local-admin-key
      INBOUND_WEBHOOK_SECRET: local-inbound-webhook-secret
      BLOCKCHAIN_MOCK: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
      RATE_LIMIT_RPS: "50"
      RATE_LIMIT_BURST: "100"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
